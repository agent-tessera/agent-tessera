[project]
name = "agent-tessera"
dynamic = ["version"]
description = "Identity, permissions, and governance for AI agents, whatever LLM they call."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Agent Tessera contributors" }]
keywords = ["ai-agents", "governance", "identity", "llm", "policy", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pyjwt[crypto]>=2.9,<3",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/agent-tessera/agent-tessera"
Documentation = "https://github.com/agent-tessera/agent-tessera/tree/main/docs"
Repository = "https://github.com/agent-tessera/agent-tessera"
Issues = "https://github.com/agent-tessera/agent-tessera/issues"
Changelog = "https://github.com/agent-tessera/agent-tessera/blob/main/CHANGELOG.md"

[project.optional-dependencies]
openai = ["openai>=1.50"]
anthropic = ["anthropic>=0.40"]
otel = [
    "opentelemetry-api>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-sdk>=1.27",
]
litellm = ["litellm>=1.50"]
bedrock = ["boto3>=1.35"]
gemini = ["google-genai>=1.0"]
langchain = ["langchain-core>=0.3"]
mcp = ["mcp>=1.0"]
openai-agents = ["openai-agents>=0.2"]
crewai = ["crewai>=0.80"]

[project.scripts]
tessera = "agent_tessera.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/agent_tessera/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_tessera"]
