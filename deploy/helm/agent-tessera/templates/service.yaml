apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-tessera.fullname" . }}
  labels:
    {{- include "agent-tessera.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: agent-tessera
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8700
      targetPort: http
