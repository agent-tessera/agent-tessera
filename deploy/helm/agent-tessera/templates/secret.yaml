{{- if not .Values.kek.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-tessera.fullname" . }}
  labels:
    {{- include "agent-tessera.labels" . | nindent 4 }}
type: Opaque
stringData:
  TESSERA_SERVER_KEK: {{ required "set kek.value or kek.existingSecret" .Values.kek.value | quote }}
  {{- if .Values.postgresql.enabled }}
  TESSERA_SERVER_DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s-postgresql:5432/%s" .Values.postgresql.auth.username (required "postgresql.auth.password is required" .Values.postgresql.auth.password) .Release.Name .Values.postgresql.auth.database | quote }}
  {{- else }}
  TESSERA_SERVER_DATABASE_URL: {{ required "database.url is required when postgresql.enabled is false" .Values.database.url | quote }}
  {{- end }}
  {{- if and .Values.oidc.issuer .Values.oidc.clientSecret }}
  TESSERA_OIDC_CLIENT_SECRET: {{ .Values.oidc.clientSecret | quote }}
  {{- end }}
{{- end }}
