name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the full error message and traceback.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Code and policy YAML that reproduce the problem. Remove secrets.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Agent Tessera version
      placeholder: "output of `tessera --version`"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version, OS, and LLM provider SDK versions
    validations:
      required: true
