name: CI

# Free-plan friendly: PRs run a small gate; the full suite runs on main
# (and on workflow_dispatch). Prefer draft PRs and local pre-push pytest
# so Actions minutes are not spent on every WIP push.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  # PR gate: one Python. Broader matrix only on main / manual.
  test:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-packages
      - run: uv run pytest

  test-matrix:
    name: test (${{ matrix.python-version }})
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-packages
      - run: uv run pytest

  test-lowest:
    name: test (lowest dependency versions)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_FROZEN: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --all-packages --resolution lowest-direct
      - run: uv run pytest

  test-postgres:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tessera
          POSTGRES_PASSWORD: tessera
          POSTGRES_DB: tessera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tessera -d tessera"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TESSERA_TEST_DATABASE_URL: postgresql+psycopg://tessera:tessera@localhost:5432/tessera
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages
      - run: >
          uv run pytest server/tests
          sdk/tests/test_e2e_chain.py
          sdk/tests/test_e2e_supervision.py
          --no-cov

  benchmarks:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages
      - run: uv run pytest -m benchmark --no-cov -p no:cacheprovider

  docker:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server/Dockerfile .

  helm:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        run: |
          curl -fsSL https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz | tar -xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
      - name: Template the chart
        run: |
          bash deploy/helm/agent-tessera/check-template.sh
          kek="$(python3 -c 'import base64; print(base64.b64encode(b"k"*32).decode())')"
          # Optional OIDC + ingress still render on top of the default shape.
          helm template tessera deploy/helm/agent-tessera \
            --set "kek.value=${kek}" \
            --set postgresql.enabled=true \
            --set postgresql.auth.password=change-me \
            --set ingress.enabled=true \
            --set oidc.issuer=https://idp.example \
            --set oidc.clientId=tessera \
            --set oidc.clientSecret=oidc-secret

  docs:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages --group docs
      - run: uv run mkdocs build --strict

  web:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and check
        working-directory: web
        run: |
          npm ci
          npm run gen:api
          git diff --exit-code -- openapi.json src/api/schema.d.ts
          npm run check
      - name: GPL fixture must fail the license allow-list
        working-directory: web
        run: |
          if LICENSE_CHECK_START=scripts/fixtures/gpl-package npm run check:licenses; then
            echo "expected GPL fixture to fail" >&2
            exit 1
          fi

  e2e:
    name: e2e
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build console
        working-directory: web
        run: npm run build
      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install chromium --with-deps
      - name: Seed script CLI smoke
        run: uv run python web/tests/e2e/seed.py --help
      - name: Run Playwright suite
        working-directory: web
        run: npm run e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            web/test-results
            web/playwright-report
            web/e2e/artifacts
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload UX polish screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ux-polish-screenshots
          path: web/e2e/artifacts/ux-polish
          if-no-files-found: ignore
          retention-days: 14

  package:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build console into the server package
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: astral-sh/setup-uv@v6
      - run: uv build --all-packages -o dist
      - run: uvx twine check --strict dist/*
      - run: uvx check-wheel-contents dist/*.whl

  audit:
    name: dependency audit
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv export --all-packages --no-emit-workspace -o requirements-audit.txt
      - run: uvx pip-audit -r requirements-audit.txt --disable-pip
