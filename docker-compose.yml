services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tessera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: tessera
    volumes:
      - tessera-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tessera -d tessera"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8700:8700"
    env_file:
      - path: .env
        required: false
    environment:
      TESSERA_SERVER_DATABASE_URL: postgresql+psycopg://tessera:${POSTGRES_PASSWORD:-change-me}@postgres:5432/tessera
      TESSERA_SERVER_ISSUER: ${TESSERA_SERVER_ISSUER:-http://127.0.0.1:8700}
      TESSERA_SERVER_KEK: ${TESSERA_SERVER_KEK:-}
    entrypoint: ["sh", "-c"]
    command:
      - tessera server migrate && exec tessera server serve --host 0.0.0.0 --port 8700

volumes:
  tessera-postgres:
